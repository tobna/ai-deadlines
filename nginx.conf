# Site config for the `website` container (nginx:latest) of docker-stacks/ai-deadlines.yaml.
# It replaces the image's default site; mount it with
#   - '/hdd/ai-deadlines/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
# nginx reads it at start, so restart the container after changing it.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # make_website.sh writes a .gz next to every text file; send it to clients that accept gzip.
    gzip_static on;
    gzip_vary on;

    # llms.txt and deadlines.md contain non-ASCII characters (em dashes), so say they are UTF-8.
    charset utf-8;
    charset_types text/plain text/markdown text/css text/xml application/javascript text/javascript;

    # nginx's mime.types has no .md, so it would be served as application/octet-stream.
    location ~* \.md$ {
        default_type text/markdown;
    }
}
