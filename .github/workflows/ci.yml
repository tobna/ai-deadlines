name: CI

on:
  push:
    # Skip CI on the automated data-only commits the update pipeline pushes.
    paths-ignore:
      - 'conferences/**'
      - 'rank/**'
      - 'README.md'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"  # the server's Python (uv:python3.13-alpine)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check aideadlines/ tests/ update.py
      - name: Test (pytest)
        run: uv run pytest
